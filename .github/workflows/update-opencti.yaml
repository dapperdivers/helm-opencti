name: Check for new OpenCTI release

on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compare versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(awk '/^appVersion:/ {print $2}' charts/opencti/Chart.yaml)
          latest=$(gh api repos/OpenCTI-Platform/opencti/releases/latest --jq .tag_name)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "Already on $current"
            exit 0
          fi
          # Only bump once the images the chart deploys are published.
          for image in platform worker; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/opencti/$image/tags/$latest")
            if [ "$code" != "200" ]; then
              echo "opencti/$image:$latest is not on Docker Hub yet (HTTP $code)"
              exit 0
            fi
          done
          if git ls-remote --exit-code --heads origin "bump/opencti-$latest" > /dev/null; then
            echo "A bump branch for $latest already exists"
            exit 0
          fi
          echo "bump=true" >> "$GITHUB_OUTPUT"

      - name: Bump appVersion and chart patch version
        if: steps.versions.outputs.bump == 'true'
        run: |
          chart=charts/opencti/Chart.yaml
          version=$(awk '/^version:/ {print $2}' "$chart")
          next=$(echo "$version" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          sed -i "s/^appVersion: .*/appVersion: ${{ steps.versions.outputs.latest }}/" "$chart"
          sed -i "s/^version: .*/version: $next/" "$chart"
          echo "next=$next" >> "$GITHUB_ENV"

      - name: Install Helm
        if: steps.versions.outputs.bump == 'true'
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      # Pull requests opened with GITHUB_TOKEN do not trigger other workflows,
      # so the chart is linted here before the pull request is opened.
      - name: Lint and template
        if: steps.versions.outputs.bump == 'true'
        run: |
          cd charts
          helm dependency build opencti
          for values in opencti/ci/*-values.yaml; do
            helm lint opencti -f "$values"
            helm template test opencti -f "$values" > /dev/null
          done

      - name: Open pull request
        if: steps.versions.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "bump/opencti-$LATEST"
          git commit -am "feat: bump appVersion to OpenCTI $LATEST"
          git push origin "bump/opencti-$LATEST"
          gh pr create \
            --title "feat: bump appVersion to OpenCTI $LATEST" \
            --body "OpenCTI \`$CURRENT\` → \`$LATEST\` (chart \`$next\`).

          Release notes: https://github.com/OpenCTI-Platform/opencti/releases/tag/$LATEST
          Breaking changes: https://docs.opencti.io/latest/deployment/breaking-changes/

          Lint and template passed in the workflow run that opened this pull request."

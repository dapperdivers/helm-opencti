name: Lint & Template

on:
  pull_request:
    paths:
      - "charts/opencti/**"
      - ".github/workflows/lint.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Add Helm repos
        run: |
          helm repo add opensearch https://opensearch-project.github.io/helm-charts/
          helm repo add rustfs https://charts.rustfs.com
          helm repo update

      - name: Build dependencies
        run: |
          cd charts
          helm dependency build opencti

      - name: Lint and template (each ci/*-values.yaml)
        run: |
          cd charts
          for values in opencti/ci/*-values.yaml; do
            echo "::group::$values"
            helm lint opencti -f "$values"
            helm template test opencti -f "$values" > /dev/null
            echo "::endgroup::"
          done

      - name: Required values fail with a clear message
        run: |
          cd charts
          if helm template test opencti > /dev/null 2> err.txt; then
            echo "expected a failure when no credentials are set"; exit 1
          fi
          cat err.txt
          # With the bundled S3 configured, the chart's own check must fire.
          if helm template test opencti --set rustfs.secret.rustfs.secret_key=x > /dev/null 2> err.txt; then
            echo "expected a failure when no OpenCTI credentials are set"; exit 1
          fi
          cat err.txt
          grep -q "is required" err.txt

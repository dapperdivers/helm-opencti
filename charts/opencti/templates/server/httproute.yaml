{{- if .Values.server.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "opencti.fullname" . }}-server
  labels:
    {{- include "opencti.serverLabels" . | nindent 4 }}
    {{- with .Values.server.route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.server.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "server.route.parentRefs is required when server.route.enabled=true" .Values.server.route.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.server.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- if .Values.server.route.matches }}
        {{- toYaml .Values.server.route.matches | nindent 8 }}
        {{- else }}
        - path:
            type: PathPrefix
            value: {{ .Values.opencti.basePath | default "/" | quote }}
        {{- end }}
      {{- with .Values.server.route.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "opencti.fullname" . }}-server
          port: {{ .Values.server.service.port }}
{{- end }}

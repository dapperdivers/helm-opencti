apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "opencti.fullname" . }}-test-connection"
  labels:
    {{- include "opencti.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: {{ .Values.readyChecker.image | default "busybox:1.37" }}
      env:
        - name: HEALTH_ACCESS_KEY
          {{- include "opencti.healthAccessKeyRef" . | nindent 10 }}
      command:
        - sh
        - -c
        - wget -q -O /dev/null "http://{{ include "opencti.fullname" . }}-server:{{ .Values.server.service.port }}{{ include "opencti.basePathPrefix" . }}/health?health_access_key=${HEALTH_ACCESS_KEY}"

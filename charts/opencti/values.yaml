# ============================================================================
# helm-opencti — values.yaml
# Sane defaults with auto-wiring. Override only what you need.
# ============================================================================

global:
  imagePullSecrets: []

fullnameOverride: ""
nameOverride: ""

# -- OpenCTI platform image (shared by server)
image:
  repository: opencti/platform
  pullPolicy: IfNotPresent
  tag: ""  # defaults to Chart.appVersion

# -- ServiceAccount (shared)
serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

# ============================================================================
# OPENCTI CORE CONFIG
# Single source of truth — auto-propagated to server, workers, connectors
# ============================================================================
opencti:
  adminEmail: admin@opencti.io

  # Every credential below can be given inline (stored in the chart-managed
  # "<fullname>-credentials" Secret) or read from a Secret you manage with the
  # matching *ExistingSecret: {name, key}. Pods only ever see secretKeyRefs.

  adminPassword: ""          # REQUIRED unless adminPasswordExistingSecret is set
  adminPasswordExistingSecret: {}
  #   name: opencti-credentials
  #   key: password            # default: password

  adminToken: ""             # REQUIRED (UUIDv4) unless adminTokenExistingSecret is set
  adminTokenExistingSecret: {}
  #   name: opencti-credentials
  #   key: token               # default: token

  # -- Mandatory since OpenCTI 7. Generate once with `openssl rand -base64 32`
  # and never change it afterwards: it encrypts API tokens stored in the platform.
  encryptionKey: ""          # REQUIRED unless encryptionKeyExistingSecret is set
  encryptionKeyExistingSecret: {}
  #   name: opencti-credentials
  #   key: encryption-key      # default: encryption-key

  # -- Optional separate token for connectors (least privilege). Defaults to the admin token.
  connectorTokenExistingSecret: {}
  #   name: opencti-credentials
  #   key: connector-token     # default: token

  # -- Key for the /health endpoint. Defaults to the admin token when both are empty.
  # Probes read it from the container environment, so it never appears in the pod spec.
  healthAccessKey: ""
  healthAccessKeyExistingSecret: {}
  #   name: opencti-credentials
  #   key: health-access-key   # default: health-access-key

  basePath: "/"

  metrics:
    enabled: true
    port: 14269

# ============================================================================
# READY CHECKER — enabled by default (biggest pain point in devops-ia chart)
# Waits for all dependencies before starting server/workers/connectors
# ============================================================================
readyChecker:
  enabled: true
  image: busybox:1.37
  retries: 60
  timeout: 5

# ============================================================================
# SERVER
# ============================================================================
server:
  replicaCount: 1
  nodeOptions: "--max-old-space-size=8096"

  strategy: {}

  service:
    type: ClusterIP
    port: 80
    targetPort: 4000
    labels: {}
    annotations: {}

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    #   - host: opencti.example.com
    #     paths:
    #       - path: /
    #         pathType: Prefix
    tls: []

  # -- Gateway API HTTPRoute (alternative to ingress)
  route:
    enabled: false
    annotations: {}
    labels: {}
    parentRefs: []
    #   - name: internal
    #     namespace: kube-system
    #     sectionName: https
    hostnames: []
    #   - opencti.example.com
    matches: []              # defaults to PathPrefix on opencti.basePath
    filters: []

  podDisruptionBudget:
    enabled: false
    # minAvailable: 1        # takes precedence over maxUnavailable when set
    maxUnavailable: 1

  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      memory: 8Gi

  # Probes call /health from inside the container (see templates/_helpers.tpl).
  # The startup probe gates the other two, so they need no initial delay.
  startupProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60     # 10 minutes for first boot / migrations

  # Liveness tolerates 90s of failed checks so a busy server is not restarted.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6

  # Readiness only removes the pod from the Service, so it can be stricter.
  readinessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # /tmp is always mounted as an emptyDir, so the root filesystem can stay read-only.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  volumes: []
  volumeMounts: []
  initContainers: []
  extraEnv: []
  envFrom: []
  terminationGracePeriodSeconds: 30

# ============================================================================
# WORKER
# ============================================================================
worker:
  enabled: true
  replicaCount: 3

  image:
    repository: opencti/worker
    pullPolicy: IfNotPresent
    tag: ""  # defaults to Chart.appVersion

  logLevel: info

  strategy: {}

  telemetry:
    enabled: true
    port: 14269

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 1Gi

  podDisruptionBudget:
    enabled: false
    # minAvailable: 1        # takes precedence over maxUnavailable when set
    maxUnavailable: 1

  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  volumes: []
  volumeMounts: []
  initContainers: []
  extraEnv: []
  envFrom: []
  terminationGracePeriodSeconds: 30

# ============================================================================
# MONITORING — Prometheus Operator resources
# Creates a ServiceMonitor for the server and a PodMonitor for the workers.
# ============================================================================
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []
  metricRelabelings: []

# ============================================================================
# EXTERNAL SERVICES — first-class config blocks (not raw env vars!)
# Set enabled: true + connection details. Auto-wired into all components.
# Passwords can be inline or come from existingSecret.
# ============================================================================

# -- External Elasticsearch/OpenSearch (when opensearch subchart is disabled)
externalElasticsearch:
  enabled: false
  url: ""                     # e.g., http://opensearch.database:9200
  username: ""
  password: ""
  existingSecret: {}
  #   name: opensearch-credentials
  #   key: password            # default: password

# -- External Redis / Dragonfly / Valkey (used unless redis.enabled=true)
externalRedis:
  enabled: true
  hostname: ""                # REQUIRED — e.g., dragonfly.database.svc.cluster.local
  port: 6379
  mode: single                # single | sentinel | cluster
  password: ""
  existingSecret: {}
  #   name: redis-credentials
  #   key: password            # default: password

# -- External RabbitMQ (takes precedence over the built-in RabbitMQ)
externalRabbitmq:
  enabled: false
  hostname: ""
  port: 5672
  managementPort: 15672
  username: user
  password: ""
  existingSecret: {}
  #   name: rabbitmq-credentials
  #   key: rabbitmq-password   # default: rabbitmq-password

# -- External S3 (takes precedence over the rustfs subchart)
# Works with Garage, AWS S3, Ceph RGW, or any other S3-compatible store.
# Garage example:
#   endpoint: garage.storage.svc.cluster.local
#   port: 3900
#   region: garage             # must match s3_region in garage.toml
externalS3:
  enabled: false
  endpoint: ""                # hostname only, no scheme
  port: 9000
  accessKey: ""
  secretKey: ""
  existingSecret: {}
  #   name: opencti-s3
  #   accessKeyKey: access-key # default: access-key
  #   secretKeyKey: secret-key # default: secret-key
  bucketName: opencti-bucket
  region: ""
  useSSL: false

# ============================================================================
# SUBCHARTS — toggle with enabled: true/false
# When disabled, use the corresponding external* config above
# ============================================================================

# -- OpenSearch subchart
opensearch:
  enabled: true
  replicas: 1
  opensearchJavaOpts: "-Xms4g -Xmx4g"
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      memory: 6Gi
  persistence:
    enabled: true
    size: 100Gi
    # storageClass: ""
    # Subchart default is busybox:latest, which policies that forbid `latest` reject.
    image: busybox
    imageTag: "1.37"
  sysctlInit:
    enabled: true            # sets vm.max_map_count
    # Subchart default is busybox:latest, which policies that forbid `latest` reject.
    image: busybox
    imageTag: "1.37"
  securityConfig:
    enabled: false           # disable security for internal-only access
  config:
    opensearch.yml: |
      cluster.name: opencti
      network.host: 0.0.0.0
      plugins.security.disabled: true

# -- RabbitMQ (built-in, uses official image — no Bitnami dependency)
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: 4.1-management-alpine
    pullPolicy: IfNotPresent
  auth:
    username: user
    password: ""              # REQUIRED unless existingSecret is set
    existingSecret: {}
    #   name: rabbitmq-credentials
    #   key: rabbitmq-password   # default: rabbitmq-password
  # OpenCTI-specific settings
  consumerTimeout: 86400000     # 24h — OpenCTI connectors need long timeouts
  maxMessageSize: 536870912     # 512MB — STIX bundles can be large
  persistence:
    enabled: true
    size: 10Gi
    # storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []

# -- Bundled Redis-compatible store (Dragonfly subchart, aliased as "redis").
# Off by default: point externalRedis at an existing instance, or enable this
# for a self-contained install. No authentication is configured.
redis:
  enabled: false
  storage:
    enabled: false
  # Dragonfly needs 256MiB per thread and defaults to one thread per host core,
  # so the thread count is pinned to fit the memory limit below.
  extraArgs:
    - --cache_mode=true
    - --proactor_threads=2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

# -- RustFS subchart: bundled S3-compatible object storage.
# Disable it and use externalS3 for Garage, AWS S3 or another S3 store.
# (Replaces the MinIO subchart, whose container images are no longer published.)
rustfs:
  enabled: true
  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false
  ingress:
    enabled: false
  secret:
    rustfs:
      access_key: opencti
      secret_key: ""            # REQUIRED while rustfs.enabled=true
  storageclass:
    name: ""                    # empty = cluster default StorageClass
    dataStorageSize: 20Gi
    logStorageSize: 256Mi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

# ============================================================================
# CONNECTORS
# Map of connector-name → config. Auto-wired with OPENCTI_URL + OPENCTI_TOKEN.
# You only need to set connector-specific env vars.
# ============================================================================
# -- Global connector settings (applied to ALL connectors)
connectorsGlobal:
  extraEnv: []
  envFrom: []
  #   - secretRef:
  #       name: opencti-connector-secrets

connectors: {}
  # Example: CISA Known Exploited Vulnerabilities (free, no API key)
  # cisa-known-exploited-vulnerabilities:
  #   enabled: true
  #   image:
  #     repository: opencti/connector-cisa-known-exploited-vulnerabilities
  #     tag: ""   # defaults to appVersion
  #   env:
  #     CONNECTOR_ID: "changeme-uuid"
  #     CONNECTOR_NAME: "CISA KEV"
  #     CONNECTOR_SCOPE: "cisa"
  #     CONNECTOR_LOG_LEVEL: "info"
  #     CONNECTOR_DURATION_PERIOD: "PT24H"
  #   resources:
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  #     limits:
  #       memory: 512Mi

  # Example: CVE (NVD database, free)
  # cve:
  #   enabled: true
  #   image:
  #     repository: opencti/connector-cve
  #   env:
  #     CONNECTOR_ID: "changeme-uuid"
  #     CONNECTOR_NAME: "CVE"
  #     CONNECTOR_SCOPE: "identity,vulnerability"
  #     CONNECTOR_LOG_LEVEL: "info"
  #     CVE_INTERVAL: "24"

  # Example: MITRE ATT&CK (free)
  # mitre:
  #   enabled: true
  #   image:
  #     repository: opencti/connector-mitre
  #   env:
  #     CONNECTOR_ID: "changeme-uuid"
  #     CONNECTOR_NAME: "MITRE ATT&CK"
  #     CONNECTOR_SCOPE: "tool,report,malware,identity,campaign,intrusion-set,attack-pattern,course-of-action,x-mitre-data-source,x-mitre-data-component,x-mitre-matrix,x-mitre-tactic,x-mitre-collection"
  #     MITRE_INTERVAL: "7"

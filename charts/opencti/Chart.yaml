apiVersion: v2
name: opencti
description: |
  OpenCTI Helm chart with auto-wiring, external service support, and sane defaults.
  Built on lessons learned from devops-ia/helm-opencti.
type: application
version: 0.5.0
appVersion: 7.261119.0
home: https://github.com/dapperdivers/helm-opencti
maintainers:
  - name: dapperdivers
    url: https://github.com/dapperdivers
sources:
  - https://github.com/OpenCTI-Platform/opencti
keywords:
  - opencti
  - cybersecurity
  - threat-intelligence
  - stix
  - cti
dependencies:
  - name: opensearch
    version: 3.4.0
    repository: https://opensearch-project.github.io/helm-charts/
    condition: opensearch.enabled
  - name: rustfs
    version: 1.0.6
    repository: https://charts.rustfs.com
    condition: rustfs.enabled
  - name: dragonfly
    alias: redis
    version: v2.1.0
    repository: oci://ghcr.io/dragonflydb/dragonfly/helm
    condition: redis.enabled
